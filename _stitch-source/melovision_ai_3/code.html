<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-display { font-family: 'Space Grotesk', sans-serif; }
        
        /* Synesthetic Canvas custom styles */
        .glass-panel {
            background: rgba(54, 51, 66, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(74, 68, 85, 0.2);
        }
        
        .spectral-shadow {
            box-shadow: 0 24px 64px -12px rgba(229, 224, 243, 0.04);
        }
        
        .input-glow:focus-within {
            outline: none;
            box-shadow: inset 0 0 0 1px rgba(210, 187, 255, 0.5), 0 0 20px 0 rgba(210, 187, 255, 0.15);
            border-color: rgba(210, 187, 255, 0.5);
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #7C3AED 0%, #03B5D3 100%);
            transition: all 0.3s ease;
        }
        
        .btn-gradient:hover {
            box-shadow: 0 0 20px rgba(210, 187, 255, 0.3);
            transform: translateY(-1px);
        }
        
        /* Floating animations for decorative elements */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        
        @keyframes float-fast {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-3deg); }
        }
        
        .float-1 { animation: float-slow 8s ease-in-out infinite; }
        .float-2 { animation: float-fast 6s ease-in-out infinite 1s; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #14121f; }
        ::-webkit-scrollbar-thumb { background: #363342; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a4455; }
